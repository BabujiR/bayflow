# Local development: demo users are seeded (see StartupData) and the refresh
# cookie works over plain http://localhost.
bayflow:
  auth:
    cookie:
      secure: ${BAYFLOW_COOKIE_SECURE:false}
    # Swagger UI on http://localhost:8083 signs in to the "demo" workshop.
    fallback-workshop: ${BAYFLOW_FALLBACK_WORKSHOP:demo}

logging:
  level:
    com.bayflow: DEBUG
