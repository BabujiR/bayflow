server:
  port: ${PORT:8083}
  # Trust X-Forwarded-* from nginx so the client IP used for rate limiting is the real one
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: auth-service
  datasource:
    url: ${BAYFLOW_DB_URL:jdbc:postgresql://localhost:5432/bayflow}
    # Runtime login: not the table owner, so row-level security applies (RowLevelSecurityGuard checks).
    username: ${BAYFLOW_DB_USER:bayflow_app}
    password: ${BAYFLOW_DB_PASSWORD:bayflow_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: bayflow
        # Multi-tenancy: fills and filters tenant_id on every @TenantId entity (fails closed).
        tenant_identifier_resolver: com.bayflow.security.BayflowTenantResolver
  flyway:
    # All services share schema "bayflow"; each keeps its own history table.
    schemas: bayflow
    default-schema: bayflow
    table: flyway_history_auth
    # Another service may already have tables in the schema. Baseline at 0 so V1 still runs.
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration
    # Migrations run as the table owner; the services themselves connect as the app role.
    user: ${BAYFLOW_DB_OWNER_USER:bayflow}
    password: ${BAYFLOW_DB_OWNER_PASSWORD:bayflow}
    placeholders:
      # Same fixed value in every service: the workshop pre-multi-tenancy data belongs to.
      default_tenant_id: 00000000-0000-0000-0000-000000000001
      # The runtime login that migrations grant access to (row-level security applies to it).
      app_role: ${BAYFLOW_DB_USER:bayflow_app}
      # Settings of the default workshop when they are first created (V5).
      default_labour_rate: ${BAYFLOW_LABOUR_RATE:95.00}
      default_currency: ${BAYFLOW_CURRENCY:USD}
      default_time_zone: ${BAYFLOW_WORKSHOP_ZONE:America/New_York}
  data:
    web:
      pageable:
        max-page-size: 100

bayflow:
  auth:
    issuer: ${BAYFLOW_JWT_ISSUER:bayflow-auth}
    audience: ${BAYFLOW_JWT_AUDIENCE:bayflow}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    system-token-ttl: 10m
    keys:
      private-key-path: ${BAYFLOW_JWT_PRIVATE_KEY_PATH:}
      public-key-path: ${BAYFLOW_JWT_PUBLIC_KEY_PATH:}
      key-id: ${BAYFLOW_JWT_KEY_ID:}
      allow-ephemeral: ${BAYFLOW_JWT_ALLOW_EPHEMERAL:true}
    cookie:
      name: bayflow_rt
      path: /api/v1/auth
      secure: ${BAYFLOW_COOKIE_SECURE:true}
      same-site: Strict
    login:
      max-failed-attempts: 5
      lock-duration: 15m
      max-attempts-per-minute: 10
    bootstrap-admin:
      username: ${BAYFLOW_BOOTSTRAP_ADMIN_USERNAME:admin}
      email: ${BAYFLOW_BOOTSTRAP_ADMIN_EMAIL:admin@bayflow.local}
      password: ${BAYFLOW_BOOTSTRAP_ADMIN_PASSWORD:}
    clients:
      appointment-service:
        secret: ${BAYFLOW_SYSTEM_CLIENT_SECRET:dev-system-secret}
        roles: [SYSTEM]
      # Reads workshop settings (labour rate, currency) when opening job cards.
      workshop-service:
        secret: ${BAYFLOW_WORKSHOP_CLIENT_SECRET:dev-workshop-secret}
        roles: [SYSTEM]
    # Starting settings of a new workshop (each workshop then edits its own in the app).
    tenant-defaults:
      labour-rate: ${BAYFLOW_LABOUR_RATE:95.00}
      currency: ${BAYFLOW_CURRENCY:USD}
      time-zone: ${BAYFLOW_WORKSHOP_ZONE:America/New_York}
    # Self-service sign-up of new workshops (POST /api/v1/tenants/signup).
    signup:
      max-per-hour-per-ip: ${BAYFLOW_SIGNUP_MAX_PER_HOUR:10}
    # Workshop for sign-in at an address without one (Swagger UI on :8083, scripts). Empty = none.
    fallback-workshop: ${BAYFLOW_FALLBACK_WORKSHOP:}
  # Workshops live at <slug>.<base domain>; the base domain itself is the public sign-up site.
  tenancy:
    base-domain: ${BAYFLOW_BASE_DOMAIN:localhost}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Bayflow auth-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.bayflow: INFO
