server:
  port: ${PORT:8083}
  # Trust X-Forwarded-* from nginx so the client IP used for rate limiting is the real one
  forward-headers-strategy: native
  tomcat:
    # Read the rest of a too-large upload so the client gets the 413 instead of a reset connection.
    max-swallow-size: 8MB
  error:
    include-message: never
    include-stacktrace: never

spring:
  # Java 25 virtual threads for requests and scheduled jobs: a request waiting on Postgres or
  # another service no longer holds an OS thread. The connection pool is now the limit.
  threads:
    virtual:
      enabled: true
  main:
    # Virtual threads don't keep the JVM alive on their own.
    keep-alive: true
  application:
    name: auth-service
  datasource:
    url: ${BAYFLOW_DB_URL:jdbc:postgresql://localhost:5432/bayflow}
    # Runtime login: not the table owner, so row-level security applies (RowLevelSecurityGuard checks).
    username: ${BAYFLOW_DB_USER:bayflow_app}
    password: ${BAYFLOW_DB_PASSWORD:bayflow_app}
    hikari:
      # Four services share one Postgres on a small VM: a pool each, sized to its load.
      maximum-pool-size: ${BAYFLOW_DB_POOL_SIZE:6}
      # Fail fast when the pool is exhausted, instead of piling up waiting requests.
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: bayflow
        # Multi-tenancy: fills and filters tenant_id on every @TenantId entity (fails closed).
        tenant_identifier_resolver: com.bayflow.security.BayflowTenantResolver
        # Lazy collections of many rows are loaded 50 parents at a time (no query per row), and
        # inserts and updates go to the database in batches.
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    # All services share schema "bayflow"; each keeps its own history table.
    schemas: bayflow
    default-schema: bayflow
    table: flyway_history_auth
    # Another service may already have tables in the schema. Baseline at 0 so V1 still runs.
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration
    # Migrations run as the table owner; the services themselves connect as the app role.
    user: ${BAYFLOW_DB_OWNER_USER:bayflow}
    password: ${BAYFLOW_DB_OWNER_PASSWORD:bayflow}
    placeholders:
      # Same fixed value in every service: the workshop pre-multi-tenancy data belongs to.
      default_tenant_id: 00000000-0000-0000-0000-000000000001
      # The runtime login that migrations grant access to (row-level security applies to it).
      app_role: ${BAYFLOW_DB_USER:bayflow_app}
      # Settings of the default workshop when they are first created (V5).
      default_labour_rate: ${BAYFLOW_LABOUR_RATE:95.00}
      default_currency: ${BAYFLOW_CURRENCY:USD}
      default_time_zone: ${BAYFLOW_WORKSHOP_ZONE:America/New_York}
  servlet:
    multipart:
      # Branding images: logo up to 1 MB, cover up to 3 MB (BrandingImages checks each kind).
      max-file-size: 3MB
      max-request-size: 4MB
  data:
    web:
      pageable:
        max-page-size: 100

bayflow:
  auth:
    issuer: ${BAYFLOW_JWT_ISSUER:bayflow-auth}
    audience: ${BAYFLOW_JWT_AUDIENCE:bayflow}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    system-token-ttl: 10m
    # A staff password reset gives a temporary password that works this long.
    temporary-password-ttl: 72h
    keys:
      private-key-path: ${BAYFLOW_JWT_PRIVATE_KEY_PATH:}
      public-key-path: ${BAYFLOW_JWT_PUBLIC_KEY_PATH:}
      key-id: ${BAYFLOW_JWT_KEY_ID:}
      allow-ephemeral: ${BAYFLOW_JWT_ALLOW_EPHEMERAL:true}
    cookie:
      name: bayflow_rt
      path: /api/v1/auth
      secure: ${BAYFLOW_COOKIE_SECURE:true}
      same-site: Strict
    login:
      max-failed-attempts: 5
      lock-duration: 15m
      max-attempts-per-minute: 10
    bootstrap-admin:
      username: ${BAYFLOW_BOOTSTRAP_ADMIN_USERNAME:admin}
      email: ${BAYFLOW_BOOTSTRAP_ADMIN_EMAIL:admin@bayflow.local}
      password: ${BAYFLOW_BOOTSTRAP_ADMIN_PASSWORD:}
    # The first Ramplight console user (<base domain>/console); not created while the password is empty.
    platform-admin:
      username: ${BAYFLOW_PLATFORM_ADMIN_USERNAME:ramplight}
      email: ${BAYFLOW_PLATFORM_ADMIN_EMAIL:team@bayflow.local}
      password: ${BAYFLOW_PLATFORM_ADMIN_PASSWORD:}
    clients:
      appointment-service:
        secret: ${BAYFLOW_SYSTEM_CLIENT_SECRET:dev-system-secret}
        roles: [SYSTEM]
      # Reads workshop settings (labour rate, currency) when opening job cards.
      workshop-service:
        secret: ${BAYFLOW_WORKSHOP_CLIENT_SECRET:dev-workshop-secret}
        roles: [SYSTEM]
      # Asks who works at a location, to send them notifications.
      notification-service:
        secret: ${BAYFLOW_NOTIFICATION_CLIENT_SECRET:dev-notification-secret}
        roles: [SYSTEM]
    # Starting settings of a new workshop (each workshop then edits its own in the app).
    tenant-defaults:
      labour-rate: ${BAYFLOW_LABOUR_RATE:95.00}
      currency: ${BAYFLOW_CURRENCY:USD}
      time-zone: ${BAYFLOW_WORKSHOP_ZONE:America/New_York}
    # Password-reset e-mails. Off until BAYFLOW_MAIL_HOST is set (smtp.gmail.com, a provider, or
    # mailpit locally). Gmail: port 587, the full address as username, an App Password.
    mail:
      host: ${BAYFLOW_MAIL_HOST:}
      port: ${BAYFLOW_MAIL_PORT:587}
      username: ${BAYFLOW_MAIL_USERNAME:}
      password: ${BAYFLOW_MAIL_PASSWORD:}
      smtp-auth: ${BAYFLOW_MAIL_SMTP_AUTH:true}
      start-tls: ${BAYFLOW_MAIL_STARTTLS:true}
      from: ${BAYFLOW_MAIL_FROM:}
      # Reset links go to <slug>.<this host>.
      site-url: ${BAYFLOW_SITE_URL:http://localhost:3000}
    # "Request a demo" on the public site: who is e-mailed (empty = stored only), and the limit per IP.
    demo:
      notify-email: ${BAYFLOW_DEMO_NOTIFY_EMAIL:}
      max-per-hour-per-ip: ${BAYFLOW_DEMO_MAX_PER_HOUR:5}
    # Workshop sign-up (POST /api/v1/tenants/signup), by setup invite from the console only.
    signup:
      max-per-hour-per-ip: ${BAYFLOW_SIGNUP_MAX_PER_HOUR:10}
      invite-ttl: ${BAYFLOW_INVITE_TTL:P7D}
      # One reminder e-mail when an unused invite is this close to expiring (checked hourly).
      invite-reminder-before: ${BAYFLOW_INVITE_REMINDER_BEFORE:P2D}
    # Asked before a location is archived whether it still has upcoming appointments.
    appointment-url: ${BAYFLOW_APPOINTMENT_URL:http://localhost:8081}
    # Workshop for sign-in at an address without one (Swagger UI on :8083, scripts). Empty = none.
    fallback-workshop: ${BAYFLOW_FALLBACK_WORKSHOP:}
  # Workshops live at <slug>.<base domain>; the base domain itself is the public sign-up site.
  tenancy:
    base-domain: ${BAYFLOW_BASE_DOMAIN:localhost}

management:
  endpoints:
    web:
      exposure:
        # prometheus: scraped from inside the network only (nginx never routes /actuator).
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      # Request latency percentiles (p95, p99) in Prometheus, for the latency alert.
      percentiles-histogram:
        http.server.requests: true
  tracing:
    # Share of requests traced. Trace and span ids are in every log line either way.
    sampling:
      probability: ${BAYFLOW_TRACING_SAMPLING:0.1}
    export:
      otlp:
        # Off until there is a collector (Jaeger, Tempo, an OTel collector...).
        enabled: ${BAYFLOW_TRACING_EXPORT:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${BAYFLOW_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        # Metrics are scraped by Prometheus instead.
        enabled: false
  info:
    env:
      enabled: true

info:
  app:
    name: Ramplight auth-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    # Every line carries the service, trace, span and request id (X-Request-Id from nginx).
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{requestId:-}] "
  level:
    com.bayflow: INFO
