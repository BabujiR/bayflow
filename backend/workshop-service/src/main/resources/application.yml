server:
  port: ${PORT:8082}
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: workshop-service
  datasource:
    url: ${BAYFLOW_DB_URL:jdbc:postgresql://localhost:5432/bayflow}
    # Runtime login: not the table owner, so row-level security applies (RowLevelSecurityGuard checks).
    username: ${BAYFLOW_DB_USER:bayflow_app}
    password: ${BAYFLOW_DB_PASSWORD:bayflow_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: bayflow
        # Multi-tenancy: fills and filters tenant_id on every @TenantId entity (fails closed).
        tenant_identifier_resolver: com.bayflow.security.BayflowTenantResolver
  flyway:
    # Shared schema "bayflow"; this service owns the ws_* tables and its own history table.
    schemas: bayflow
    default-schema: bayflow
    table: flyway_history_workshop
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration
    # Migrations run as the table owner; the services themselves connect as the app role.
    user: ${BAYFLOW_DB_OWNER_USER:bayflow}
    password: ${BAYFLOW_DB_OWNER_PASSWORD:bayflow}
    placeholders:
      # Same fixed value in every service: the workshop pre-multi-tenancy data belongs to.
      default_tenant_id: 00000000-0000-0000-0000-000000000001
      # The runtime login that migrations grant access to (row-level security applies to it).
      app_role: ${BAYFLOW_DB_USER:bayflow_app}
      # Money frozen onto job cards and history that existed before per-workshop settings.
      default_labour_rate: ${BAYFLOW_LABOUR_RATE:95.00}
      default_currency: ${BAYFLOW_CURRENCY:USD}

bayflow:
  # A user token only works at its own workshop's address, <slug>.<base domain>.
  tenancy:
    base-domain: ${BAYFLOW_BASE_DOMAIN:localhost}
  security:
    jwt:
      jwk-set-uri: ${BAYFLOW_JWKS_URI:http://localhost:8083/.well-known/jwks.json}
      issuer: ${BAYFLOW_JWT_ISSUER:bayflow-auth}
      audience: ${BAYFLOW_JWT_AUDIENCE:bayflow}
  workshop:
    # Labour rate and currency now come from each workshop's settings in auth-service.
    auth-url: ${BAYFLOW_AUTH_URL:http://localhost:8083}
    client-id: workshop-service
    client-secret: ${BAYFLOW_WORKSHOP_CLIENT_SECRET:dev-workshop-secret}
    settings-cache-ttl: 5m
    # Estimate ready / decided / work complete → notification-service, through the outbox.
    notifications:
      enabled: true
      url: ${BAYFLOW_NOTIFICATION_URL:http://localhost:8084}
      send-immediately: true
      dispatcher-enabled: true
      interval-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: Ramplight workshop-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.bayflow: INFO
