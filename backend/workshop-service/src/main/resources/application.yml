server:
  port: ${PORT:8082}
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never

spring:
  # Java 25 virtual threads for requests and scheduled jobs: a request waiting on Postgres or
  # another service no longer holds an OS thread. The connection pool is now the limit.
  threads:
    virtual:
      enabled: true
  main:
    # Virtual threads don't keep the JVM alive on their own.
    keep-alive: true
  application:
    name: workshop-service
  datasource:
    url: ${BAYFLOW_DB_URL:jdbc:postgresql://localhost:5432/bayflow}
    # Runtime login: not the table owner, so row-level security applies (RowLevelSecurityGuard checks).
    username: ${BAYFLOW_DB_USER:bayflow_app}
    password: ${BAYFLOW_DB_PASSWORD:bayflow_app}
    hikari:
      # Four services share one Postgres on a small VM: a pool each, sized to its load.
      maximum-pool-size: ${BAYFLOW_DB_POOL_SIZE:10}
      # Fail fast when the pool is exhausted, instead of piling up waiting requests.
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: bayflow
        # Multi-tenancy: fills and filters tenant_id on every @TenantId entity (fails closed).
        tenant_identifier_resolver: com.bayflow.security.BayflowTenantResolver
        # Lazy collections of many rows are loaded 50 parents at a time (no query per row), and
        # inserts and updates go to the database in batches.
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    # Shared schema "bayflow"; this service owns the ws_* tables and its own history table.
    schemas: bayflow
    default-schema: bayflow
    table: flyway_history_workshop
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration
    # Migrations run as the table owner; the services themselves connect as the app role.
    user: ${BAYFLOW_DB_OWNER_USER:bayflow}
    password: ${BAYFLOW_DB_OWNER_PASSWORD:bayflow}
    placeholders:
      # Same fixed value in every service: the workshop pre-multi-tenancy data belongs to.
      default_tenant_id: 00000000-0000-0000-0000-000000000001
      # The runtime login that migrations grant access to (row-level security applies to it).
      app_role: ${BAYFLOW_DB_USER:bayflow_app}
      # Money frozen onto job cards and history that existed before per-workshop settings.
      default_labour_rate: ${BAYFLOW_LABOUR_RATE:95.00}
      default_currency: ${BAYFLOW_CURRENCY:USD}

bayflow:
  # A user token only works at its own workshop's address, <slug>.<base domain>.
  tenancy:
    base-domain: ${BAYFLOW_BASE_DOMAIN:localhost}
  security:
    jwt:
      jwk-set-uri: ${BAYFLOW_JWKS_URI:http://localhost:8083/.well-known/jwks.json}
      issuer: ${BAYFLOW_JWT_ISSUER:bayflow-auth}
      audience: ${BAYFLOW_JWT_AUDIENCE:bayflow}
  workshop:
    # Labour rate and currency now come from each workshop's settings in auth-service.
    auth-url: ${BAYFLOW_AUTH_URL:http://localhost:8083}
    # Invoices: the customer and vehicle to bill, from appointment-service.
    appointment-url: ${BAYFLOW_APPOINTMENT_URL:http://localhost:8081}
    # Invoice e-mails link to the workshop's site: https://<slug>.<host of this URL>.
    site-url: ${BAYFLOW_SITE_URL:http://localhost:3000}
    # QuickBooks Online (R2b): off until the Intuit app keys and the token key are set.
    quickbooks:
      client-id: ${BAYFLOW_QBO_CLIENT_ID:}
      client-secret: ${BAYFLOW_QBO_CLIENT_SECRET:}
      # sandbox (development keys) or production
      environment: ${BAYFLOW_QBO_ENVIRONMENT:sandbox}
      # Registered at Intuit; one for every workshop, on the main domain.
      redirect-uri: ${BAYFLOW_QBO_REDIRECT_URI:http://localhost:3000/api/v1/quickbooks/callback}
      # openssl rand -base64 32: encrypts the QuickBooks tokens in the database.
      token-key: ${BAYFLOW_QBO_TOKEN_KEY:}
    client-id: workshop-service
    client-secret: ${BAYFLOW_WORKSHOP_CLIENT_SECRET:dev-workshop-secret}
    settings-cache-ttl: 5m
    # Estimate approval links: e-mailed on submit, 2 reminders a day apart, valid 14 days.
    estimates:
      send-on-submit: ${BAYFLOW_ESTIMATE_SEND_ON_SUBMIT:true}
      link-lifetime: 14d
      remind-every: 1d
      max-reminders: 2
      reminders-enabled: true
    # Google review requests: each location turns them on (with its link) in Settings → Locations.
    reviews:
      ask-every: 90d
      morning: "09:00"
      sender-enabled: true
    # Estimate ready / decided / work complete → notification-service, through the outbox.
    notifications:
      enabled: true
      url: ${BAYFLOW_NOTIFICATION_URL:http://localhost:8084}
      send-immediately: true
      dispatcher-enabled: true
      interval-ms: 10000

management:
  endpoints:
    web:
      exposure:
        # prometheus: scraped from inside the network only (nginx never routes /actuator).
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      # Request latency percentiles (p95, p99) in Prometheus, for the latency alert.
      percentiles-histogram:
        http.server.requests: true
  tracing:
    # Share of requests traced. Trace and span ids are in every log line either way.
    sampling:
      probability: ${BAYFLOW_TRACING_SAMPLING:0.1}
    export:
      otlp:
        # Off until there is a collector (Jaeger, Tempo, an OTel collector...).
        enabled: ${BAYFLOW_TRACING_EXPORT:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${BAYFLOW_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        # Metrics are scraped by Prometheus instead.
        enabled: false

info:
  app:
    name: Ramplight workshop-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    # Every line carries the service, trace, span and request id (X-Request-Id from nginx).
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{requestId:-}] "
  level:
    com.bayflow: INFO
