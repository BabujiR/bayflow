bayflow:
  security:
    jwt:
      # Never called: tests use spring-security-test's jwt() instead of real tokens.
      jwk-set-uri: http://localhost:1/.well-known/jwks.json
  workshop:
    # Never called: IntegrationTestBase mocks WorkshopSettingsClient.
    auth-url: http://localhost:1
    notifications:
      # Most tests don't look at notification events; NotificationEventsIT turns them on.
      enabled: false
      send-immediately: false
      dispatcher-enabled: false

logging:
  level:
    com.bayflow: INFO
    org.testcontainers: WARN
