server:
  port: ${PORT:8084}
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: notification-service
  datasource:
    url: ${BAYFLOW_DB_URL:jdbc:postgresql://localhost:5432/bayflow}
    # Runtime login: not the table owner, so row-level security applies (RowLevelSecurityGuard checks).
    username: ${BAYFLOW_DB_USER:bayflow_app}
    password: ${BAYFLOW_DB_PASSWORD:bayflow_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: bayflow
        # Multi-tenancy: fills and filters tenant_id on every @TenantId entity (fails closed).
        tenant_identifier_resolver: com.bayflow.security.BayflowTenantResolver
  flyway:
    # Shared schema "bayflow"; this service owns the ntf_* tables and its own history table.
    schemas: bayflow
    default-schema: bayflow
    table: flyway_history_notification
    baseline-on-migrate: true
    baseline-version: "0"
    locations: classpath:db/migration
    # Migrations run as the table owner; the service itself connects as the app role.
    user: ${BAYFLOW_DB_OWNER_USER:bayflow}
    password: ${BAYFLOW_DB_OWNER_PASSWORD:bayflow}
    placeholders:
      # The runtime login that migrations grant access to (row-level security applies to it).
      app_role: ${BAYFLOW_DB_USER:bayflow_app}
  data:
    web:
      pageable:
        max-page-size: 100

bayflow:
  # A user token only works at its own workshop's address, <slug>.<base domain>.
  tenancy:
    base-domain: ${BAYFLOW_BASE_DOMAIN:localhost}
  security:
    jwt:
      jwk-set-uri: ${BAYFLOW_JWKS_URI:http://localhost:8083/.well-known/jwks.json}
      issuer: ${BAYFLOW_JWT_ISSUER:bayflow-auth}
      audience: ${BAYFLOW_JWT_AUDIENCE:bayflow}
  notification:
    # Who works at a location, and each location's name and time zone, come from auth-service.
    auth-url: ${BAYFLOW_AUTH_URL:http://localhost:8083}
    client-id: notification-service
    client-secret: ${BAYFLOW_NOTIFICATION_CLIENT_SECRET:dev-notification-secret}
    connect-timeout: 2s
    read-timeout: 5s
    staff-cache-ttl: 1m
    locations-cache-ttl: 5m
    # Zone for times in notifications when a location's can't be read.
    fallback-zone: ${BAYFLOW_WORKSHOP_ZONE:America/New_York}
    retention:
      enabled: true
      keep: 90d
      # Every night at 03:17 (server time).
      cron: "0 17 3 * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: Ramplight notification-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.bayflow: INFO
