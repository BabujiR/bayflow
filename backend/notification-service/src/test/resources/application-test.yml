bayflow:
  security:
    jwt:
      # Never called: tests use spring-security-test's jwt() instead of real tokens.
      jwk-set-uri: http://localhost:1/.well-known/jwks.json
  notification:
    # Never called: IntegrationTestBase mocks AuthClient (AuthClientTest uses WireMock).
    auth-url: http://localhost:1
    retention:
      # Tests run the clean-up themselves.
      enabled: false

logging:
  level:
    com.bayflow: INFO
    org.testcontainers: WARN
