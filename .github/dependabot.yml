version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*"]
      testing:
        patterns: ["org.testcontainers*", "org.wiremock*", "org.junit*", "org.assertj*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Bayflow stays on PostgreSQL 16. Upgrading Postgres is a deliberate,
      # manual change (new data volume path in 18+, data migration).
      - dependency-name: "postgres"

  - package-ecosystem: docker
    directories:
      - /backend/auth-service
      - /backend/appointment-service
      - /backend/workshop-service
    schedule:
      interval: weekly
    ignore:
      # Bayflow stays on Java 21 (LTS). The build and runtime images must match the
      # <java.version> in backend/pom.xml, so a Java upgrade is a deliberate, manual change.
      - dependency-name: "eclipse-temurin"
      - dependency-name: "maven"

  # Added in later milestones:
  #   npm    /frontend           (M6)
