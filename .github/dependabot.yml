version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*"]
      testing:
        patterns: ["org.testcontainers*", "org.wiremock*", "org.junit*", "org.assertj*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  # Added in later milestones:
  #   npm    /frontend           (M6)
  #   docker /backend/*-service  (M2-M4 Dockerfiles)
