version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*"]
      testing:
        patterns: ["org.testcontainers*", "org.wiremock*", "org.junit*", "org.assertj*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Bayflow stays on PostgreSQL 16. Upgrading Postgres is a deliberate,
      # manual change (new data volume path in 18+, data migration).
      - dependency-name: "postgres"

  - package-ecosystem: docker
    directories:
      - /backend/auth-service
      - /backend/appointment-service
      - /backend/workshop-service
      - /frontend
    schedule:
      interval: weekly
    ignore:
      # Bayflow stays on Java 21 (LTS). The build and runtime images must match the
      # <java.version> in backend/pom.xml, so a Java upgrade is a deliberate, manual change.
      - dependency-name: "eclipse-temurin"
      - dependency-name: "maven"
      # The web image builds with Node 22 LTS; move to the next LTS deliberately.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom", "react-router"]
      tooling:
        patterns: ["vite", "@vitejs/*", "vitest", "@tailwindcss/*", "tailwindcss"]
      lint:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "eslint-plugin-*", "prettier"]
      testing:
        patterns: ["@testing-library/*", "msw", "jsdom"]
    ignore:
      # typescript-eslint does not support TypeScript 7 yet; move up together later.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
