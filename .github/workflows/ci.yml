name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/**/pom.xml

      # Unit tests + Testcontainers integration tests (Docker is available on the runner)
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            backend/**/target/surefire-reports/
            backend/**/target/failsafe-reports/
            backend/**/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

  dependencies:
    name: Dependency vulnerabilities (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Maven and pnpm manifests: fails on a fixable HIGH or CRITICAL vulnerability.
      - name: Scan dependencies
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table

  compose:
    name: Compose config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  frontend:
    name: Frontend (lint, type-check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        # Fails on a known HIGH or CRITICAL vulnerability in what ships to browsers.
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end (full stack + Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        # Builds every image and waits until all containers report healthy.
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Playwright
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm e2e:install

      - name: API types match the services
        # The TypeScript types in src/api/schema come from the running services' OpenAPI
        # documents. If a backend change moved the API, this fails: run "pnpm api:update" with
        # the stack up and commit the result.
        working-directory: frontend
        run: |
          pnpm api:update
          if ! git diff --exit-code --stat -- src/api/schema; then
            echo "::error::src/api/schema is out of date. Run 'pnpm api:update' (stack running) and commit it."
            exit 1
          fi

      - name: Run end-to-end tests
        working-directory: frontend
        env:
          # The public site; workshops run at demo.localhost:3000 and acme.localhost:3000.
          E2E_SITE_URL: http://localhost:3000
          # Keep the videos watchable but the run reasonably quick.
          E2E_SLOWMO: '100'
          E2E_STEP_PAUSE: '400'
        run: pnpm e2e

      - name: Upload scenario videos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-videos
          path: frontend/e2e-videos/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 300

      - name: Stop the stack
        if: always()
        run: docker compose down -v
