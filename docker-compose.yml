# Bayflow local development stack.
# The full Bayflow stack: PostgreSQL, the three services and the web app (nginx) on http://localhost:3000.
#
#   docker compose up -d          start
#   docker compose ps             check health
#   docker compose down           stop (data kept)
#   docker compose down -v        stop and delete data

name: bayflow

services:
  postgres:
    image: postgres:16-alpine
    container_name: bayflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bayflow}
      POSTGRES_USER: ${POSTGRES_USER:-bayflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bayflow}
      # Password of bayflow_app, the services' runtime login (infra/postgres/init/02-create-app-role.sh)
      BAYFLOW_APP_DB_PASSWORD: ${BAYFLOW_APP_DB_PASSWORD:-bayflow_app}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bayflow-pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    image: bayflow-auth:local
    container_name: bayflow-auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # "dev" seeds the demo users customer1 / advisor1 / mechanic1 (see README)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      BAYFLOW_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bayflow}
      # Runtime login: subject to row-level security. Flyway migrates as the table owner.
      BAYFLOW_DB_USER: bayflow_app
      BAYFLOW_DB_PASSWORD: ${BAYFLOW_APP_DB_PASSWORD:-bayflow_app}
      BAYFLOW_DB_OWNER_USER: ${POSTGRES_USER:-bayflow}
      BAYFLOW_DB_OWNER_PASSWORD: ${POSTGRES_PASSWORD:-bayflow}
      BAYFLOW_SYSTEM_CLIENT_SECRET: ${BAYFLOW_SYSTEM_CLIENT_SECRET:-dev-system-secret}
      BAYFLOW_WORKSHOP_CLIENT_SECRET: ${BAYFLOW_WORKSHOP_CLIENT_SECRET:-dev-workshop-secret}
      BAYFLOW_NOTIFICATION_CLIENT_SECRET: ${BAYFLOW_NOTIFICATION_CLIENT_SECRET:-dev-notification-secret}
      # Workshops live at <slug>.<base domain>: demo.localhost:3000, acme.localhost:3000, ...
      BAYFLOW_BASE_DOMAIN: ${BAYFLOW_BASE_DOMAIN:-localhost}
      # Sign-in at an address without a workshop (Swagger UI on :8083). Empty outside dev.
      BAYFLOW_FALLBACK_WORKSHOP: ${BAYFLOW_FALLBACK_WORKSHOP:-demo}
      # Checked before a location is archived (upcoming appointments there).
      BAYFLOW_APPOINTMENT_URL: http://appointment-service:8081
      BAYFLOW_SIGNUP_MAX_PER_HOUR: ${BAYFLOW_SIGNUP_MAX_PER_HOUR:-30}
      BAYFLOW_INVITE_TTL: ${BAYFLOW_INVITE_TTL:-P7D}
      BAYFLOW_INVITE_REMINDER_BEFORE: ${BAYFLOW_INVITE_REMINDER_BEFORE:-P2D}
      # Starting settings for a workshop that has none yet; each ADMIN then sets their own.
      BAYFLOW_LABOUR_RATE: ${BAYFLOW_LABOUR_RATE:-95.00}
      BAYFLOW_CURRENCY: ${BAYFLOW_CURRENCY:-USD}
      BAYFLOW_WORKSHOP_ZONE: ${BAYFLOW_WORKSHOP_ZONE:-America/New_York}
      BAYFLOW_BOOTSTRAP_ADMIN_USERNAME: ${BAYFLOW_BOOTSTRAP_ADMIN_USERNAME:-admin}
      BAYFLOW_BOOTSTRAP_ADMIN_EMAIL: ${BAYFLOW_BOOTSTRAP_ADMIN_EMAIL:-admin@bayflow.local}
      BAYFLOW_BOOTSTRAP_ADMIN_PASSWORD: ${BAYFLOW_BOOTSTRAP_ADMIN_PASSWORD:-}
      # Empty = throwaway signing key per start. Run scripts/generate-dev-keys and set these in .env to keep tokens valid across restarts.
      BAYFLOW_JWT_PRIVATE_KEY_PATH: ${BAYFLOW_JWT_PRIVATE_KEY_PATH:-}
      BAYFLOW_JWT_PUBLIC_KEY_PATH: ${BAYFLOW_JWT_PUBLIC_KEY_PATH:-}
      # E-mail ("Forgot password?" links) goes to Mailpit locally: open http://localhost:8025.
      BAYFLOW_MAIL_HOST: ${BAYFLOW_MAIL_HOST:-mailpit}
      BAYFLOW_MAIL_PORT: ${BAYFLOW_MAIL_PORT:-1025}
      BAYFLOW_MAIL_USERNAME: ${BAYFLOW_MAIL_USERNAME:-}
      BAYFLOW_MAIL_PASSWORD: ${BAYFLOW_MAIL_PASSWORD:-}
      BAYFLOW_MAIL_SMTP_AUTH: ${BAYFLOW_MAIL_SMTP_AUTH:-false}
      BAYFLOW_MAIL_STARTTLS: ${BAYFLOW_MAIL_STARTTLS:-false}
      BAYFLOW_MAIL_FROM: ${BAYFLOW_MAIL_FROM:-no-reply@bayflow.local}
      # "Request a demo" on the public site is e-mailed here (empty = stored only).
      BAYFLOW_DEMO_NOTIFY_EMAIL: ${BAYFLOW_DEMO_NOTIFY_EMAIL:-sales@bayflow.local}
      BAYFLOW_SITE_URL: ${BAYFLOW_SITE_URL:-http://localhost:3000}
      # Ramplight console (<base domain>/console): the first PLATFORM_ADMIN, created once at
      # start-up when a password is set (change it after the first sign-in).
      BAYFLOW_PLATFORM_ADMIN_USERNAME: ${BAYFLOW_PLATFORM_ADMIN_USERNAME:-ramplight}
      BAYFLOW_PLATFORM_ADMIN_EMAIL: ${BAYFLOW_PLATFORM_ADMIN_EMAIL:-team@bayflow.local}
      BAYFLOW_PLATFORM_ADMIN_PASSWORD: ${BAYFLOW_PLATFORM_ADMIN_PASSWORD:-}
    volumes:
      - ./keys:/run/keys:ro
    ports:
      - "${AUTH_PORT:-8083}:8083"

  appointment-service:
    build:
      context: ./backend
      dockerfile: appointment-service/Dockerfile
    image: bayflow-appointment:local
    container_name: bayflow-appointment
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      BAYFLOW_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bayflow}
      # Runtime login: subject to row-level security. Flyway migrates as the table owner.
      BAYFLOW_DB_USER: bayflow_app
      BAYFLOW_DB_PASSWORD: ${BAYFLOW_APP_DB_PASSWORD:-bayflow_app}
      BAYFLOW_DB_OWNER_USER: ${POSTGRES_USER:-bayflow}
      BAYFLOW_DB_OWNER_PASSWORD: ${POSTGRES_PASSWORD:-bayflow}
      # Tokens are verified with auth-service's public key
      BAYFLOW_JWKS_URI: http://auth-service:8083/.well-known/jwks.json
      BAYFLOW_BASE_DOMAIN: ${BAYFLOW_BASE_DOMAIN:-localhost}
      # Online bookings' "change or cancel" links: https://<slug>.<this host>/book/manage?token=…
      BAYFLOW_SITE_URL: ${BAYFLOW_SITE_URL:-http://localhost:3000}
      # Fallback only, used while auth-service can't be reached (workshops set their own zone).
      BAYFLOW_WORKSHOP_ZONE: ${BAYFLOW_WORKSHOP_ZONE:-America/New_York}
      # Check-in opens the job card in workshop-service using a SYSTEM token from auth-service.
      # If workshop-service is down, the request waits in the outbox and is retried.
      BAYFLOW_AUTH_URL: http://auth-service:8083
      BAYFLOW_WORKSHOP_URL: http://workshop-service:8082
      # Booking changes go to notification-service through the same outbox (retried while it is down).
      BAYFLOW_NOTIFICATION_URL: http://notification-service:8084
      BAYFLOW_SYSTEM_CLIENT_SECRET: ${BAYFLOW_SYSTEM_CLIENT_SECRET:-dev-system-secret}
    ports:
      - "${APPOINTMENT_PORT:-8081}:8081"

  workshop-service:
    build:
      context: ./backend
      dockerfile: workshop-service/Dockerfile
    image: bayflow-workshop:local
    container_name: bayflow-workshop
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      BAYFLOW_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bayflow}
      # Runtime login: subject to row-level security. Flyway migrates as the table owner.
      BAYFLOW_DB_USER: bayflow_app
      BAYFLOW_DB_PASSWORD: ${BAYFLOW_APP_DB_PASSWORD:-bayflow_app}
      BAYFLOW_DB_OWNER_USER: ${POSTGRES_USER:-bayflow}
      BAYFLOW_DB_OWNER_PASSWORD: ${POSTGRES_PASSWORD:-bayflow}
      # Public key for verifying tokens, fetched from auth-service
      BAYFLOW_JWKS_URI: http://auth-service:8083/.well-known/jwks.json
      BAYFLOW_BASE_DOMAIN: ${BAYFLOW_BASE_DOMAIN:-localhost}
      # Each workshop's labour rate and currency come from auth-service; these two only
      # fill job cards that existed before per-workshop settings (V5 migration).
      BAYFLOW_LABOUR_RATE: ${BAYFLOW_LABOUR_RATE:-95.00}
      BAYFLOW_CURRENCY: ${BAYFLOW_CURRENCY:-USD}
      BAYFLOW_AUTH_URL: http://auth-service:8083
      BAYFLOW_APPOINTMENT_URL: http://appointment-service:8081
      BAYFLOW_WORKSHOP_CLIENT_SECRET: ${BAYFLOW_WORKSHOP_CLIENT_SECRET:-dev-workshop-secret}
      # Links in invoice e-mails, and where QuickBooks sends the admin back to.
      BAYFLOW_SITE_URL: ${BAYFLOW_SITE_URL:-http://localhost:3000}
      BAYFLOW_QBO_CLIENT_ID: ${BAYFLOW_QBO_CLIENT_ID:-}
      BAYFLOW_QBO_CLIENT_SECRET: ${BAYFLOW_QBO_CLIENT_SECRET:-}
      BAYFLOW_QBO_ENVIRONMENT: ${BAYFLOW_QBO_ENVIRONMENT:-sandbox}
      BAYFLOW_QBO_REDIRECT_URI: ${BAYFLOW_QBO_REDIRECT_URI:-http://localhost:3000/api/v1/quickbooks/callback}
      BAYFLOW_QBO_TOKEN_KEY: ${BAYFLOW_QBO_TOKEN_KEY:-}
      # Estimate and completion events go to notification-service through ws_outbox.
      BAYFLOW_NOTIFICATION_URL: http://notification-service:8084
    ports:
      - "${WORKSHOP_PORT:-8082}:8082"

  notification-service:
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    image: bayflow-notification:local
    container_name: bayflow-notification
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      BAYFLOW_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bayflow}
      # Runtime login: subject to row-level security. Flyway migrates as the table owner.
      BAYFLOW_DB_USER: bayflow_app
      BAYFLOW_DB_PASSWORD: ${BAYFLOW_APP_DB_PASSWORD:-bayflow_app}
      BAYFLOW_DB_OWNER_USER: ${POSTGRES_USER:-bayflow}
      BAYFLOW_DB_OWNER_PASSWORD: ${POSTGRES_PASSWORD:-bayflow}
      BAYFLOW_JWKS_URI: http://auth-service:8083/.well-known/jwks.json
      BAYFLOW_BASE_DOMAIN: ${BAYFLOW_BASE_DOMAIN:-localhost}
      # Who works at a location, and each location's name and time zone.
      BAYFLOW_AUTH_URL: http://auth-service:8083
      BAYFLOW_NOTIFICATION_CLIENT_SECRET: ${BAYFLOW_NOTIFICATION_CLIENT_SECRET:-dev-notification-secret}
      # Fallback only, for times in notifications while a location's zone can't be read.
      BAYFLOW_WORKSHOP_ZONE: ${BAYFLOW_WORKSHOP_ZONE:-America/New_York}
    ports:
      - "${NOTIFICATION_PORT:-8084}:8084"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_BASE_DOMAIN: ${BAYFLOW_BASE_DOMAIN:-localhost}
    image: bayflow-web:local
    container_name: bayflow-web
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      appointment-service:
        condition: service_healthy
      workshop-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    environment:
      AUTH_UPSTREAM: auth-service:8083
      APPOINTMENT_UPSTREAM: appointment-service:8081
      WORKSHOP_UPSTREAM: workshop-service:8082
      NOTIFICATION_UPSTREAM: notification-service:8084
    ports:
      - "${WEB_PORT:-3000}:8080"

  # A test inbox: catches every e-mail the stack sends (http://localhost:8025); nothing reaches
  # real people.
  mailpit:
    image: axllent/mailpit:v1.34.0
    container_name: bayflow-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  bayflow-pgdata:
