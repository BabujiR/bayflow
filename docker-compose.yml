# Bayflow local development stack.
# Milestone 5: PostgreSQL and the three services; check-in opens the job card automatically. nginx and the UI follow.
#
#   docker compose up -d          start
#   docker compose ps             check health
#   docker compose down           stop (data kept)
#   docker compose down -v        stop and delete data

name: bayflow

services:
  postgres:
    image: postgres:16-alpine
    container_name: bayflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bayflow}
      POSTGRES_USER: ${POSTGRES_USER:-bayflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bayflow}
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bayflow-pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    image: bayflow-auth:local
    container_name: bayflow-auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # "dev" seeds the demo users customer1 / advisor1 / mechanic1 (see README)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      BAYFLOW_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bayflow}
      BAYFLOW_DB_USER: ${POSTGRES_USER:-bayflow}
      BAYFLOW_DB_PASSWORD: ${POSTGRES_PASSWORD:-bayflow}
      BAYFLOW_SYSTEM_CLIENT_SECRET: ${BAYFLOW_SYSTEM_CLIENT_SECRET:-dev-system-secret}
      BAYFLOW_BOOTSTRAP_ADMIN_USERNAME: ${BAYFLOW_BOOTSTRAP_ADMIN_USERNAME:-admin}
      BAYFLOW_BOOTSTRAP_ADMIN_EMAIL: ${BAYFLOW_BOOTSTRAP_ADMIN_EMAIL:-admin@bayflow.local}
      BAYFLOW_BOOTSTRAP_ADMIN_PASSWORD: ${BAYFLOW_BOOTSTRAP_ADMIN_PASSWORD:-}
      # Empty = throwaway signing key per start. Run scripts/generate-dev-keys and set these in .env to keep tokens valid across restarts.
      BAYFLOW_JWT_PRIVATE_KEY_PATH: ${BAYFLOW_JWT_PRIVATE_KEY_PATH:-}
      BAYFLOW_JWT_PUBLIC_KEY_PATH: ${BAYFLOW_JWT_PUBLIC_KEY_PATH:-}
    volumes:
      - ./keys:/run/keys:ro
    ports:
      - "${AUTH_PORT:-8083}:8083"

  appointment-service:
    build:
      context: ./backend
      dockerfile: appointment-service/Dockerfile
    image: bayflow-appointment:local
    container_name: bayflow-appointment
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      BAYFLOW_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bayflow}
      BAYFLOW_DB_USER: ${POSTGRES_USER:-bayflow}
      BAYFLOW_DB_PASSWORD: ${POSTGRES_PASSWORD:-bayflow}
      # Tokens are verified with auth-service's public key
      BAYFLOW_JWKS_URI: http://auth-service:8083/.well-known/jwks.json
      BAYFLOW_WORKSHOP_ZONE: ${BAYFLOW_WORKSHOP_ZONE:-America/New_York}
      # Check-in opens the job card in workshop-service using a SYSTEM token from auth-service.
      # If workshop-service is down, the request waits in the outbox and is retried.
      BAYFLOW_AUTH_URL: http://auth-service:8083
      BAYFLOW_WORKSHOP_URL: http://workshop-service:8082
      BAYFLOW_SYSTEM_CLIENT_SECRET: ${BAYFLOW_SYSTEM_CLIENT_SECRET:-dev-system-secret}
    ports:
      - "${APPOINTMENT_PORT:-8081}:8081"

  workshop-service:
    build:
      context: ./backend
      dockerfile: workshop-service/Dockerfile
    image: bayflow-workshop:local
    container_name: bayflow-workshop
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      BAYFLOW_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bayflow}
      BAYFLOW_DB_USER: ${POSTGRES_USER:-bayflow}
      BAYFLOW_DB_PASSWORD: ${POSTGRES_PASSWORD:-bayflow}
      # Public key for verifying tokens, fetched from auth-service
      BAYFLOW_JWKS_URI: http://auth-service:8083/.well-known/jwks.json
      BAYFLOW_LABOUR_RATE: ${BAYFLOW_LABOUR_RATE:-95.00}
      BAYFLOW_CURRENCY: ${BAYFLOW_CURRENCY:-USD}
    ports:
      - "${WORKSHOP_PORT:-8082}:8082"

volumes:
  bayflow-pgdata:
