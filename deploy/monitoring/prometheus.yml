# Prometheus for Ramplight: scrapes the four services' /actuator/prometheus and evaluates the
# alert rules in alerts.yml. Used by the "monitoring" profile of deploy/gcp/docker-compose.yml;
# the targets are the compose service names. See docs/OBSERVABILITY.md.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

# To be notified (e-mail, Slack...), run an Alertmanager and point at it here:
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: ramplight
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["auth-service:8083"]
        labels: { service: auth }
      - targets: ["appointment-service:8081"]
        labels: { service: appointment }
      - targets: ["workshop-service:8082"]
        labels: { service: workshop }
      - targets: ["notification-service:8084"]
        labels: { service: notification }
