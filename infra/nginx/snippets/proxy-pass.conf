# The proxy settings every API location uses (included by proxy.conf, and on its own where
# a location sets its own caching, e.g. the workshops' branding images).
# Pass the original host, client IP and scheme so the services see the real caller
# (auth-service rate-limits logins per IP).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header X-Request-Id $bayflow_request_id;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
